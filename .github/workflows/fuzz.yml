name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [predicates, interval, euler, nurbs, mesh, feature, sweep, intersect, general, boolean, blend, offset, heal, expr, sketch, step, measure, eda, kicad, odb, shapes, export]
    steps:
      - uses: actions/checkout@v4
      # cargo-fuzz needs nightly; the pinned stable toolchain stays the
      # default everywhere else.
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz for 10 minutes
        working-directory: fuzz
        # libFuzzer's own memory grows past 4 GB on the boolean and blend
        # targets, past 2 GB on sweep's (issue #160: every input it held
        # then builds in under a second and a few megabytes in release), and
        # the offset target builds on blends and booleans, as the export
        # target's bodies do.
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
          ${{ (matrix.target == 'boolean' || matrix.target == 'blend' || matrix.target == 'sweep' || matrix.target == 'offset' || matrix.target == 'export') && '-rss_limit_mb=6144' || '' }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
