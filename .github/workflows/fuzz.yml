name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets to run, a JSON list such as ["odb","merge"]; empty runs every one'
        required: false
        default: ""
      file_issues:
        description: "File issues for red targets off main too (to test the issues job)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every target the nightly runs; a dispatch may name fewer.
        target: ${{ fromJSON(inputs.targets || '["predicates", "interval", "euler", "nurbs", "mesh", "feature", "merge", "sweep", "intersect", "general", "boolean", "blend", "offset", "tweak", "edit", "heal", "tolerant", "self_union", "expr", "sketch", "step", "measure", "eda", "eda_merge", "eda_pdm", "kicad", "odb", "shapes", "export", "schematic", "parts", "sheet", "sheet_metal", "projection", "drawing", "style", "hole_spec", "copper"]') }}
    steps:
      - uses: actions/checkout@v4
      # cargo-fuzz needs nightly; the pinned stable toolchain stays the
      # default everywhere else.
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      # Room to build (plan 30.D). Every run lost 3 to 5 of its 37 jobs in
      # Build, with no log ("lost communication with the server"), at two
      # jobs; the runner starves under ASan's compile. Swap on the runner's
      # spare disk lets a peak page out instead of killing the runner, and
      # the SDKs the fuzz build never uses free the root disk its target
      # dir fills.
      - name: Swap and disk
        run: |
          free -m; df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # 16 GB on /mnt where the runner has it, else 8 GB on /.
          f=/mnt/fuzz.swap; g=16
          if [ "$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc 0-9)" -lt 24 ] 2>/dev/null \
             || ! mountpoint -q /mnt; then f=/fuzz.swap; g=8; fi
          sudo swapoff -a
          sudo fallocate -l ${g}G $f
          sudo chmod 600 $f
          sudo mkswap $f
          sudo swapon $f
          free -m; df -h / /mnt || true
      # Built apart from the run, so a build failure is told from a find.
      # Two jobs, not the runner's four: 30.A's dispatches lost 4 of about
      # 38 jobs mid-build, with no log ("lost communication"), and every
      # one hung in this step, which looks like memory starvation on the
      # 16 GB runner under ASan. 30.B measured the cap (see its PR).
      - name: Build
        id: build
        working-directory: fuzz
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        # A line a minute of memory, swap and disk, so a build that starves
        # says how far it got.
        run: |
          (while sleep 60; do
            echo "resources $(date -u +%H:%M:%S) mem $(free -m | awk '/^Mem/{print $3"/"$2}') MB, swap $(free -m | awk '/^Swap/{print $3}') MB, disk $(df -m --output=avail / | tail -1) MB free"
          done) &
          s=$!
          trap 'kill $s' EXIT
          cargo +nightly fuzz build ${{ matrix.target }}
      # A fixed sample of a slow corpus (#934). sweep's 670 seeds took
      # 1,995 s to replay and feature's 2,730 took 410 s (run 44153707736),
      # so sweep never mutated within its 600 s. libFuzzer replays smallest
      # first, and there the small seeds cost milliseconds and the rest
      # seconds each (sweep's 256 smallest in 7 s, its next 256 in 921 s;
      # feature's 1,024 smallest in 30 s, its next 1,024 in 350 s). The
      # sample is the SMALL smallest (by size, then name), MORE of the
      # rest by name, and every seed fuzz/pinned.txt keeps: the same every
      # night. A find goes to the sample's folder and its artifacts, as a
      # find in the full corpus did. Other targets replay their whole
      # corpus.
      - name: Corpus sample
        if: matrix.target == 'sweep' || matrix.target == 'feature'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SMALL: ${{ fromJSON('{"sweep":237,"feature":1024}')[matrix.target] }}
          MORE: ${{ fromJSON('{"sweep":30,"feature":40}')[matrix.target] }}
        run: |
          set -euo pipefail
          src=fuzz/corpus/$TARGET; dst=$RUNNER_TEMP/sample/$TARGET
          mkdir -p "$dst"
          find "$src" -maxdepth 1 -type f -printf '%s %f\n' | LC_ALL=C sort -k1,1n -k2,2 > "$RUNNER_TEMP/by_size"
          sed -n "1,${SMALL}p" "$RUNNER_TEMP/by_size" | cut -d' ' -f2 > "$RUNNER_TEMP/small"
          sed -n "$((SMALL + 1)),\$p" "$RUNNER_TEMP/by_size" | cut -d' ' -f2 | LC_ALL=C sort > "$RUNNER_TEMP/rest"
          sed -n "1,${MORE}p" "$RUNNER_TEMP/rest" > "$RUNNER_TEMP/more"
          { grep "^$TARGET/" fuzz/pinned.txt | cut -d/ -f2- || true; } > "$RUNNER_TEMP/pinned"
          cat "$RUNNER_TEMP/small" "$RUNNER_TEMP/more" "$RUNNER_TEMP/pinned" | LC_ALL=C sort -u |
            while read -r f; do if [ -f "$src/$f" ]; then cp "$src/$f" "$dst/"; fi; done
          echo "sample: $(ls "$dst" | wc -l) of $(ls "$src" | wc -l) seeds ($(wc -l < "$RUNNER_TEMP/pinned") pinned)"
          echo "CORPUS=$dst" >> "$GITHUB_ENV"
      - name: Fuzz for 10 minutes
        id: fuzz
        working-directory: fuzz
        # bash, for pipefail: the log is kept for the report below.
        shell: bash
        # Memory (design 600, plan 30.C). Most out-of-memory kills were
        # ASan's, not the code's: at each kill the live heap was 2 to 10%
        # of RSS, the rest ASan's 256 MB quarantine, its stack depot (about
        # 2 GB of self_union's 2.6 GB alone), its allocator's free lists
        # for millions of small chunks (never returned to the OS) and its
        # shadow. Every target runs with a 64 MB quarantine and its free
        # pages returned each second. Each -rss_limit_mb is the largest
        # session peak measured, times 1.5, rounded up to a power of two,
        # at least libFuzzer's 2,048 and at most 6,144: an hour on
        # cox-worker-4 under these options for feature (3,038 MB), sweep
        # (2,718 MB), self_union (2,577) and offset (1,839, #746); for
        # tolerant the nightlies' 2,027 (its hour stops at #905's crashes)
        # until 30.D's third dispatch passed 4,096 under ASan alone (its
        # corpus stays near 80 MB in release), so 6,144;
        # and the largest `rss:` of the last 15 runs' green jobs for the
        # rest (boolean 2,215, sheet 1,819, drawing 1,423). The peaks are
        # in docs/claude/kernel-work.md (Fuzzing memory). -malloc_limit_mb
        # keeps one allocation over 2 GB loud whatever the RSS limit. The
        # feature, sweep, offset, tweak, edit, projection, self_union and
        # tolerant targets run each case under ryukei_testkit::FUZZ_DEADLINE
        # (450 s; feature's rebuilds, interference and sweeps through their
        # job's cancel, plan 30.D, #769), so they take a 600 s timeout; the
        # rest keep libFuzzer's 1,200 s.
        env:
          ASAN_OPTIONS: quarantine_size_mb=64:allocator_release_to_os_interval_ms=1000
          RSS_LIMIT_MB: ${{ fromJSON('{"feature":6144,"sweep":4096,"boolean":4096,"offset":4096,"tolerant":6144,"self_union":4096,"sheet":4096,"drawing":4096}')[matrix.target] || 2048 }}
          TIMEOUT_S: ${{ fromJSON('{"feature":600,"sweep":600,"offset":600,"tweak":600,"edit":600,"projection":600,"self_union":600,"tolerant":600}')[matrix.target] || 1200 }}
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} ${CORPUS:-} -- -max_total_time=600
          -rss_limit_mb=$RSS_LIMIT_MB -malloc_limit_mb=2048 -timeout=$TIMEOUT_S
          2>&1 | tee "$RUNNER_TEMP/fuzz.log"
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
      # One line for the issues job: target, kind, libFuzzer's summary.
      - name: What went wrong
        if: failure()
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUILD: ${{ steps.build.outcome }}
          FUZZ: ${{ steps.fuzz.outcome }}
        run: |
          mkdir -p report
          summary=""
          if [ "$BUILD" = failure ]; then
            kind="build failure"
          elif [ "$FUZZ" = failure ]; then
            summary=$(grep -m1 'SUMMARY: ' "$RUNNER_TEMP/fuzz.log" | sed 's/.*SUMMARY: //' | tr '\t' ' ' || true)
            case "$summary" in
              *out-of-memory*|*malloc*) kind="out of memory" ;;
              *timeout*) kind="timeout" ;;
              "") kind="failure without a libFuzzer summary" ;;
              *) kind="crash" ;;
            esac
          else
            kind="setup failure"
          fi
          printf '%s\t%s\t%s\n' "$TARGET" "$kind" "$summary" > "report/$TARGET.tsv"
          cat "report/$TARGET.tsv"
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report-${{ matrix.target }}
          path: report/${{ matrix.target }}.tsv

  issues:
    # A red night files itself (design 600, question 779): one open issue
    # per red target, titled `fuzz nightly: <target> red`, labelled fuzz
    # and bug; a later red night comments on it instead. It never closes
    # one: the fix does. Off main only when a dispatch asks (to test it).
    name: file issues for red targets
    needs: fuzz
    if: failure() && (github.ref == 'refs/heads/main' || inputs.file_issues)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fuzz-report-*
          merge-multiple: true
          path: reports
      - name: One open issue per red target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          gh label create fuzz --color 5319e7 --description "Found by the fuzz nightly" --force
          shopt -s nullglob
          # A job whose runner died (lost communication, out of disk)
          # leaves no report: it is filed as one too, from the run's jobs.
          mkdir -p reports
          gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' |
            while read -r target; do
              if [ ! -f "reports/$target.tsv" ]; then
                printf '%s\t%s\t\n' "$target" "runner lost, no report" > "reports/$target.tsv"
              fi
            done
          for f in reports/*.tsv; do
            IFS=$'\t' read -r target kind summary < "$f"
            title="fuzz nightly: $target red"
            body="Run: $RUN_URL ($EVENT on $REF at $SHA)
          Kind: $kind"
            if [ -n "$summary" ]; then
              body="$body
          libFuzzer: \`$summary\`"
            fi
            # Only a run that fuzzed leaves an artifact.
            case "$kind" in
              "build failure" | "setup failure" | "runner lost"*) ;;
              *)
              body="$body
          Artifact: \`fuzz-$target-artifacts\`, kept 90 days: \`gh run download $GITHUB_RUN_ID -n fuzz-$target-artifacts -R $GH_REPO\`"
              ;;
            esac
            n=$(gh issue list --state open --label fuzz --search "\"$title\" in:title" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$n" ]; then
              gh issue comment "$n" --body "$body"
              echo "commented on #$n: $title"
            else
              gh issue create --title "$title" --label fuzz --label bug --body "$body"
            fi
          done
