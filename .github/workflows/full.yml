name: Full

# Every test on every platform: the workspace's tests in debug builds, the
# release suites, the golden hashes at higher CPU levels, the devcontainer
# with OCCT and SMLib, and the installers. Hours on Windows and macOS, so
# pull requests run ci.yml's fast checks instead, and this runs by hand
# (workflow_dispatch) and before every release, which refuses to publish
# unless it passes (release.yml calls it).
on:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Every property test draws the same cases on every run of this
  # workflow, so a release gate passes or fails on the code alone, never
  # on a random draw (issue #180: a fresh case failed v0.7.0-pre.2's
  # run). New cases come from changing this on purpose, from local runs
  # (random unless it is set) and from fuzzing. The devcontainer job
  # passes it in by hand: its commands run in the container.
  PROPTEST_RNG_SEED: "7275"

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        # The app's dependencies (wgpu, egui) fill the runner's small disk.
        name: room on the disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Rare runs: their caches would only evict the fast CI's.
          save-if: false
      - if: runner.os == 'Linux'
        name: a software graphics adapter (lavapipe) for ryucad-app's tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Linux has lavapipe and Windows has WARP, so the app's drawing
          # tests must run there; a macOS runner may have no Metal device.
          RYUCAD_REQUIRE_GPU: ${{ runner.os != 'macOS' && '1' || '' }}
      - if: failure()
        name: the viewport as drawn, if it no longer matches its snapshot
        uses: actions/upload-artifact@v4
        with:
          name: viewport-${{ matrix.os }}
          path: crates/ryucad-app/tests/snapshots/*.new.png
          if-no-files-found: ignore

  release-suites:
    # Beside the workspace's tests, not after them, so neither waits for
    # the other (issue #63: the Windows job ran them one after the other,
    # 43-54 min in all).
    name: release suites on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        name: room on the disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Rare runs: their caches would only evict the fast CI's.
          save-if: false
      # Boolean property tests and the booleans at other scales
      # self-intersection-check every result, pipe
      # property tests fit every branch, blends on pipes and ruled
      # chamfers fit their rails, corners mesh many blended boxes, and
      # heal and STEP round trip tests write and heal hundreds of seeded
      # bodies, the committed STEP files' bodies are self-intersection
      # checked, and ryucad's bar times a 1,000-hole pattern against
      # ryukei's own boolean, and its assembly bars time 1,000 mates and a
      # cold daemon over a warm disk cache, and ryueda's bar times a design
      # of 10,000 component occurrences and a warm daemon's write, and
      # ryudfm's a dense board read and drawn (here a seeded stand-in; the
      # devcontainer job times the pinned board): minutes in a debug build,
      # so they are ignored there and run in release.
      - run: cargo test -p ryukei --release --test boolean_props
      - run: cargo test -p ryukei --release --test booleans
      - run: cargo test -p ryukei --release --test general_booleans
      - run: cargo test -p ryukei --release --test general_boolean_props
      - run: cargo test -p ryukei --release --test pipe_props
      - run: cargo test -p ryukei --release --test general_props
      - run: cargo test -p ryukei --release --test blends
      - run: cargo test -p ryukei --release --test chamfers
      - run: cargo test -p ryukei --release --test blend_props
      - run: cargo test -p ryukei --release --test corners
      - run: cargo test -p ryukei --release --test corner_props
      - run: cargo test -p ryukei --release --test blend_booleans
      - run: cargo test -p ryukei --release --test heal_props
      - run: cargo test -p ryukei --release --test mirror
      - run: cargo test -p ryukei --release --test along
      - run: cargo test -p ryukei --release --test loft
      - run: cargo test -p ryukei --release --test measure_props
      - run: cargo test -p ryustep --release --test round_trip_props
      - run: cargo test -p ryustep --release --test write
      - run: cargo test -p ryustep --release --test drill
      - run: cargo test -p ryustep --release --test checks
      - run: cargo test -p ryucad --release --test bar -- --nocapture
      - run: cargo test -p ryucad --release --test assembly_bar -- --nocapture
      - run: cargo test -p ryupdm --release --test api -- --nocapture
      - run: cargo test -p ryucad --release --test step_bar -- --nocapture
      - run: cargo test -p ryucad --release --test step
      - run: cargo test -p ryueda --release --test bar -- --nocapture
      - run: cargo test -p ryudfm --release --test bar -- --nocapture
      - run: cargo bench --workspace --no-run

  kicad-corpus:
    # KiCad 9.0.9's whole symbol, footprint and 3D model libraries (0.7 GB
    # fetched, 3.4 GB unpacked; never committed), imported by ryueda in
    # release: every item imports or is a typed refusal, and no fewer
    # import than crates/ryueda/tests/kicad/pinned.txt records.
    name: KiCad corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: room on the disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Rare runs: their caches would only evict the fast CI's.
          save-if: false
      - uses: actions/cache@v4
        with:
          path: target/kicad/*.tar.gz
          key: kicad-${{ hashFiles('crates/ryueda/tests/kicad/pinned.txt') }}
      - run: sh scripts/fetch-kicad.sh
      - run: cargo test -p ryueda --release --test kicad_corpus -- --nocapture
        env:
          RYUEDA_REQUIRE_KICAD: '1'

  cpu-levels:
    # Results must not depend on CPU-level codegen (vectorization, FMA-capable
    # targets). Release builds at higher x86-64 levels must reproduce the
    # committed golden hashes.
    name: golden hashes at x86-64-v3/v4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Rare runs: their caches would only evict the fast CI's.
          save-if: false
      - name: baseline release
        run: cargo test -p ryukei -p ryusketch -p ryumate -p ryustep -p ryucad -p ryu-board -p ryueda -p ryudfm --release --test determinism
      - name: x86-64-v3
        run: cargo test -p ryukei -p ryusketch -p ryumate -p ryustep -p ryucad -p ryu-board -p ryueda -p ryudfm --release --test determinism
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target/v3
      - name: x86-64-v4 (when the runner has AVX-512)
        run: |
          if grep -qw avx512f /proc/cpuinfo; then
            RUSTFLAGS="-C target-cpu=x86-64-v4" CARGO_TARGET_DIR=target/v4 \
              cargo test -p ryukei -p ryusketch -p ryumate -p ryustep -p ryucad -p ryu-board -p ryueda -p ryudfm --release --test determinism
          else
            echo "::notice::runner has no AVX-512; x86-64-v4 skipped"
          fi
      # Releases stamp the tag's version in before they test (release.yml),
      # so a golden hash that reads the version must fail here, before
      # anything is published.
      - name: a stamped version, as a release builds
        run: |
          sh scripts/stamp-version.sh 9.9.9-ci
          cargo test --locked -p ryukei -p ryusketch -p ryumate -p ryustep -p ryucad --release --test determinism
        env:
          CARGO_TARGET_DIR: target/stamped

  devcontainer:
    name: devcontainer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        # The app's dependencies (wgpu, egui) fill the runner's small disk.
        name: room on the disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: devcontainers/ci@v0.3
        with:
          # The workspace, then the OCCT and SMLib comparison, which only
          # the devcontainer (with OCCT and SMLib installed) builds, then
          # ryudfm's pinned boards, exported by its KiCad, and its bars on
          # the densest of them.
          runCmd: |
            export PROPTEST_RNG_SEED=${{ env.PROPTEST_RNG_SEED }}
            RYUCAD_REQUIRE_GPU=1 cargo test --workspace
            sh scripts/fetch-dfm-corpus.sh
            cargo test -p ryudfm --release --test pinned -- --ignored
            RYUDFM_REQUIRE_CORPUS=1 cargo test -p ryudfm --release --test bar -- --nocapture
            cargo clippy -p ryukei-bench --features occt,smlib --all-targets -- -D warnings
            cargo test -p ryukei-bench --features occt,smlib --release --test kernels -- --nocapture
            cargo bench -p ryukei-bench --features occt,smlib --no-run
          push: never

  installers:
    name: installers on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Rare runs: their caches would only evict the fast CI's.
          save-if: false
      - run: cargo build --locked --release -p ryucad -p ryucad-app -p ryueda -p ryudfm
      - if: runner.os == 'Linux'
        run: |
          shellcheck install.sh scripts/test-install.sh scripts/smoke.sh scripts/fetch-dfm-corpus.sh
          shellcheck install-ryueda.sh scripts/test-install-ryueda.sh scripts/smoke-ryueda.sh scripts/stamp-version.sh
          shellcheck install-ryudfm.sh scripts/test-install-ryudfm.sh scripts/smoke-ryudfm.sh
      - if: runner.os == 'Linux'
        name: the desktop entry and MIME type the installer registers
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils libxml2-utils
          desktop-file-validate packaging/linux/ryucad.desktop
          xmllint --noout packaging/linux/ryucad.xml
      - if: runner.os == 'macOS'
        name: the launcher the installer compiles
        run: osacompile -o "$RUNNER_TEMP/ryucad.app" packaging/macos/ryucad.applescript
      - if: runner.os == 'Linux'
        name: a software graphics adapter for the app's smoke run
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: smoke test
        shell: bash
        run: |
          x=""
          [ "$RUNNER_OS" = Windows ] && x=".exe"
          sh scripts/smoke.sh "target/release/ryucad$x" "target/release/ryucad-app$x"
        env:
          RYUCAD_REQUIRE_GPU: ${{ runner.os != 'macOS' && '1' || '' }}
      - name: ryueda's smoke test
        shell: bash
        run: |
          x=""
          [ "$RUNNER_OS" = Windows ] && x=".exe"
          sh scripts/smoke-ryueda.sh "target/release/ryueda$x"
      - name: ryudfm's smoke test
        shell: bash
        run: |
          x=""
          [ "$RUNNER_OS" = Windows ] && x=".exe"
          sh scripts/smoke-ryudfm.sh "target/release/ryudfm$x"
      - if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - if: runner.os != 'Windows'
        run: sh scripts/test-install-ryueda.sh
      - if: runner.os != 'Windows'
        run: sh scripts/test-install-ryudfm.sh
      - if: runner.os == 'Windows'
        name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $findings = 'install.ps1', 'scripts/test-install.ps1', 'install-ryueda.ps1', 'scripts/test-install-ryueda.ps1',
            'install-ryudfm.ps1', 'scripts/test-install-ryudfm.ps1' |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error }
          $findings
          if ($findings) { throw 'PSScriptAnalyzer findings' }
      - if: runner.os == 'Windows'
        name: Windows PowerShell 5.1
        shell: pwsh
        run: scripts/test-install.ps1 -Shell powershell
      - if: runner.os == 'Windows'
        name: PowerShell 7
        shell: pwsh
        run: scripts/test-install.ps1 -Shell pwsh
      - if: runner.os == 'Windows'
        name: ryueda's, Windows PowerShell 5.1
        shell: pwsh
        run: scripts/test-install-ryueda.ps1 -Shell powershell
      - if: runner.os == 'Windows'
        name: ryueda's, PowerShell 7
        shell: pwsh
        run: scripts/test-install-ryueda.ps1 -Shell pwsh
      - if: runner.os == 'Windows'
        name: ryudfm's, Windows PowerShell 5.1
        shell: pwsh
        run: scripts/test-install-ryudfm.ps1 -Shell powershell
      - if: runner.os == 'Windows'
        name: ryudfm's, PowerShell 7
        shell: pwsh
        run: scripts/test-install-ryudfm.ps1 -Shell pwsh
