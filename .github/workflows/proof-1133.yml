# Scratch (#1133): never merged. On macOS: ryueda's watcher test 20 times,
# ryu-session's tests, and 20 rounds of four clients starting one project's
# daemon at once, counting the daemons left serving it.
name: proof-1133
on:
  push:
    branches: [cox/fix-1133-macos-proof]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          shared-key: clippy
          save-if: false
      - run: cargo build -p ryueda && cargo test -p ryueda --test cli --no-run
      - name: ryu-session
        run: cargo test -p ryu-session
      - name: the watcher test, 20 times
        run: |
          fails=0
          for i in $(seq 1 30); do
            if cargo test -q -p ryueda --test cli watchers_hear_of_library_changes > out.txt 2>&1; then
              echo "run $i ok"
            else
              fails=$((fails + 1)); echo "run $i FAILED"; cat out.txt
            fi
          done
          echo "watcher test: $((30 - fails)) of 30 ok"
          [ "$fails" = 0 ]
