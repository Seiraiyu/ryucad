# Scratch (#1133): never merged. On macOS: ryueda's watcher test 20 times,
# ryu-session's tests, and 20 rounds of four clients starting one project's
# daemon at once, counting the daemons left serving it.
name: proof-1133
on:
  push:
    branches: [cox/fix-1133-macos-proof]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          shared-key: clippy
          save-if: false
      - run: cargo build -p ryueda && cargo test -p ryueda --test cli --no-run
      - name: ryu-session
        run: cargo test -p ryu-session
      - name: the watcher test, sampled when a call stalls
        run: |
          fails=0
          for i in $(seq 1 30); do
            cargo test -q -p ryueda --test cli watchers_hear_of_library_changes > out.txt 2>&1 &
            t=$!
            sampled=0
            while kill -0 $t 2>/dev/null; do
              sleep 1
              if [ $sampled = 0 ]; then
                ps -axo pid=,etime=,command= | grep "[r]yueda participants" | while read pid et rest; do
                  case $et in *:0[5-9]|*:[1-5][0-9]|*-*|*:*:*) ;; *) continue ;; esac
                  echo "== run $i: participants $pid stalled ($et)"
                  sample $pid 2 -mayDie -file cli-$i.txt >/dev/null 2>&1; cat cli-$i.txt | grep -E "Thread_|ryu|std::|interprocess|read|write|connect|lock|wait" | head -60
                  for d in $(pgrep -f "daemon run"); do
                    echo "== daemon $d"; sample $d 2 -mayDie -file d-$i-$d.txt >/dev/null 2>&1; grep -E "Thread_|ryu|std::|interprocess|read|write|connect|lock|wait|accept" d-$i-$d.txt | head -150
                  done
                  touch stalled-$i
                done
                [ -e stalled-$i ] && sampled=1
              fi
            done
            if wait $t; then echo "run $i ok"; else fails=$((fails + 1)); echo "run $i FAILED"; grep -o "the watcher heard nothing.*" out.txt | cut -c1-600; fi
          done
          echo "watcher test: $((30 - fails)) of 30 ok"
