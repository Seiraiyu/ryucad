# Scratch (#1133): never merged. On macOS, ryueda's watcher test 60 times
# as a plain loop (the shape that failed 3 in 30 before the fix): with the
# fix (asserted), and at pre.3's commit (counted only).
name: proof-1133
on:
  push:
    branches: [cox/fix-1133-macos-proof]
permissions:
  contents: read
jobs:
  fixed:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          shared-key: clippy
          save-if: false
      - run: cargo test -p ryueda --test cli --no-run
      - name: ryu-session (descriptors on macOS)
        run: cargo test -p ryu-session
      - name: the watcher tests, 60 times
        run: |
          fails=0
          for i in $(seq 1 60); do
            if cargo test -q -p ryueda --test cli watchers_hear > out.txt 2>&1; then
              echo "run $i ok"
            else
              fails=$((fails + 1)); echo "run $i FAILED"; grep -E "panicked|heard nothing" out.txt | cut -c1-400
            fi
          done
          echo "fixed: $((60 - fails)) of 60 ok"
          [ "$fails" = 0 ]
  unfixed:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e0f631f3654b6aeae91ec397d20fc3b9269a5fb
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          shared-key: clippy
          save-if: false
      - run: cargo test -p ryueda --test cli --no-run
      - name: the watcher tests, 60 times (counted only)
        run: |
          fails=0
          for i in $(seq 1 60); do
            if cargo test -q -p ryueda --test cli watchers_hear > out.txt 2>&1; then
              echo "run $i ok"
            else
              fails=$((fails + 1)); echo "run $i FAILED"
            fi
          done
          echo "unfixed: $((60 - fails)) of 60 ok"
