name: CI

# The fast checks every pull request must pass, in under 10 minutes on
# every platform: fmt, clippy, a build, the unit tests and the golden
# hashes everywhere, and every test that isn't ignored on Linux x64. The
# rest (debug builds of every test on every platform, the release suites,
# CPU levels, the devcontainer, the installers) is full.yml's, run by hand
# and before every release. Pushes to main run these checks too, which
# keeps the caches pull requests start from warm.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a pull request cancels its run in progress.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every test that isn't ignored, the doctests too.
          - os: ubuntu-latest
            tests: --workspace
          # The unit tests and the golden hashes.
          - os: ubuntu-24.04-arm
            tests: --workspace --lib --bins --test determinism
          - os: macos-latest
            tests: --workspace --lib --bins --test determinism
          - os: windows-latest
            tests: --workspace --lib --bins --test determinism
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests read main's caches; only main saves them, so
          # they aren't evicted by one cache per pull request.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - if: matrix.os == 'ubuntu-latest'
        name: a software graphics adapter (lavapipe) for ryucad-app's tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The ci profile (Cargo.toml): optimized a little, no debug info.
      - run: cargo nextest run --cargo-profile ci --profile ci ${{ matrix.tests }}
        env:
          # Linux has lavapipe, so the app's drawing tests must run there.
          RYUCAD_REQUIRE_GPU: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --profile ci --workspace --doc
      - if: failure()
        name: the viewport as drawn, if it no longer matches its snapshot
        uses: actions/upload-artifact@v4
        with:
          name: viewport-${{ matrix.os }}
          path: crates/ryucad-app/tests/snapshots/*.new.png
          if-no-files-found: ignore
