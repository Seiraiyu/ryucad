name: ryueda release

# A ryueda-vX.Y.Z tag builds, tests and publishes a ryueda release, then
# tests its installers against it. ryueda's version line is its own
# (design 150): release.yml's v[0-9]... tags never match these, nor these
# its (crates/ryueda/tests/release.rs checks both). Nothing is published
# unless the full tests (full.yml) pass on the tagged commit. Run by hand
# (workflow_dispatch) for a dry run that builds and tests every target but
# publishes nothing.
on:
  push:
    tags: ["ryueda-v[0-9]+.[0-9]+.[0-9]+*"]
    # TEMPORARY: plan 0.E's dry run; reverted before review.
    branches: ["cox/ryueda-0e-execute-0BHHAEYG"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  version:
    # The version comes from the tag; the repo's workspace version is a
    # placeholder (0.0.0), stamped before anything is built.
    name: version from the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#ryueda-v}
            if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag $GITHUB_REF_NAME is not ryueda-vX.Y.Z or ryueda-vX.Y.Z-pre"
              exit 1
            fi
          else
            version=0.0.0-dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  full:
    name: full tests
    uses: ./.github/workflows/full.yml

  build:
    name: ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # ryucad's release targets: static musl on Linux, the static CRT
        # on Windows.
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      NAME: ryueda-${{ needs.version.outputs.version }}-${{ matrix.target }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - name: stamp the version
        run: sh scripts/stamp-version.sh "${{ needs.version.outputs.version }}"
        shell: bash
      - run: rustup toolchain install && rustup target add "$TARGET"
        shell: bash
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ryueda-${{ matrix.target }}
      - name: golden hashes on the release target
        run: cargo test --locked -p ryueda --release --target "$TARGET" --test determinism
        shell: bash
      - name: build
        run: RYUEDA_COMMIT="${GITHUB_SHA::12}" cargo build --locked --release -p ryueda --target "$TARGET"
        shell: bash
      - name: stage
        shell: bash
        run: |
          x=""
          [ "$RUNNER_OS" = Windows ] && x=".exe"
          mkdir -p "dist/$NAME"
          cp "target/$TARGET/release/ryueda$x" "dist/$NAME/"
      - name: smoke test
        shell: bash
        run: |
          x=""
          [ "$RUNNER_OS" = Windows ] && x=".exe"
          exe="dist/$NAME/ryueda$x"
          out=$("$exe" version)
          echo "$out"
          echo "$out" | grep -q "\"target\":\"$TARGET\""
          echo "$out" | grep -q "\"ryueda\":\"${{ needs.version.outputs.version }}\""
          echo "$out" | grep -q "\"commit\":\"${GITHUB_SHA::12}\""
          sh scripts/smoke-ryueda.sh "$exe"
      - name: package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:NAME" -DestinationPath "dist/$env:NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.*
          if-no-files-found: error

  publish:
    name: publish
    if: github.ref_type == 'tag'
    needs: [version, build, full]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, to find the ryueda release before this one.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # Notes since the ryueda release before this one, not since
          # whatever release of ryucad's came last.
          since=""
          prev=$(git -c versionsort.suffix=- tag --list 'ryueda-v*' --sort=-v:refname |
            grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)
          [ -n "$prev" ] && since="--notes-start-tag $prev"
          # Never "latest": that is ryucad's, which install.sh and
          # install.ps1 (releases/latest) fetch.
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" --title "ryueda ${GITHUB_REF_NAME#ryueda-v}" \
            --generate-notes $since $pre --latest=false \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS install-ryueda.sh install-ryueda.ps1

  installers:
    name: install on ${{ matrix.os }}
    if: github.ref_type == 'tag'
    needs: [version, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      RYUEDA_VERSION: ${{ github.ref_name }}
      WANT: ${{ needs.version.outputs.version }}
    steps:
      # The documented private-repository form: fetch the script with gh.
      - if: runner.os != 'Windows'
        run: gh release download "$RYUEDA_VERSION" -R "$GITHUB_REPOSITORY" -p install-ryueda.sh -O - | sh
      - if: runner.os != 'Windows'
        name: fresh shells find the installed version
        run: |
          bash -lc 'ryueda version' | grep -q "\"ryueda\":\"$WANT\""
          if command -v zsh >/dev/null; then zsh -c 'ryueda version' | grep -q "\"ryueda\":\"$WANT\""; fi
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gh release download $env:RYUEDA_VERSION -R $env:GITHUB_REPOSITORY -p install-ryueda.ps1 -O install-ryueda.ps1
          Get-Content -Raw install-ryueda.ps1 | Invoke-Expression
      - if: runner.os == 'Windows'
        name: a fresh shell finds the installed version
        shell: pwsh
        run: |
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $out = powershell -NoProfile -Command "`$env:Path = '$userPath;' + `$env:Path; ryueda version"
          $out
          if ($out -notmatch "`"ryueda`":`"$env:WANT`"") { throw 'wrong version on PATH' }
