[workspace]
resolver = "3"
members = ["crates/ryu-math", "crates/ryu-board", "crates/ryudfm", "crates/ryukei", "crates/ryukei-bench", "crates/ryukei-testkit", "crates/ryusketch", "crates/ryumate", "crates/ryu-part21", "crates/ryustep", "crates/ryu-doc", "crates/ryu-session", "crates/ryucad-doc", "crates/ryupdm", "crates/ryucad", "crates/ryucad-app", "crates/ryueda"]
exclude = ["fuzz"]

[workspace.package]
# 0.0.0 in the repo: releases stamp the version from their tag
# (scripts/stamp-version.sh, run by .github/workflows/release.yml).
version = "0.0.0"
edition = "2024"
repository = "https://github.com/seiraiyu/ryucad"

# Exact reference arithmetic dominates test time; optimize it even in dev.
[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.num-rational]
opt-level = 3

# PR CI's tests (.github/workflows/ci.yml): the dev profile, a little
# optimized and without debug info, so the workspace builds and tests in
# minutes rather than the hour a debug build takes. The golden hashes hold
# in it as in dev and release.
[profile.ci]
inherits = "dev"
opt-level = 1
debug = false
incremental = false
