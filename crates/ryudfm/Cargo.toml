[package]
name = "ryudfm"
description = "Design for manufacturing of printed circuit boards: ODB++ jobs read into ryu-board's model, projects of boards in Git, renders, and the agent CLI"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
# Rust only: no C or assembly to build on any platform.
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
ryu-board = { path = "../ryu-board" }
ryu-doc = { path = "../ryu-doc" }
ryu-session = { path = "../ryu-session" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Jobs are read and parsed per file in parallel.
rayon = "1"
# Archives and singly compressed files, all pure Rust: flate2's default
# backend is miniz_oxide, and zip takes only its flate2 deflate.
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# matrix/stackup.xml.
roxmltree = "0.21"

[features]
# The test-only ODB++ writer and malformed jobs, for this crate's tests and
# the fuzz targets.
testing = ["ryu-board/testing"]

[dev-dependencies]
assert_cmd = "2"
ryudfm = { path = ".", features = ["testing"] }
sha2 = "0.11"
tempfile = "3"

# musl's allocator is slow under multithreaded allocation; ryucad's and
# ryueda's release binaries take mimalloc for the same reason.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"
