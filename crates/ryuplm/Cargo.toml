[package]
name = "ryuplm"
description = "Product lifecycle management: a catalogue of items, part numbers and BOMs in Git, independent of any authoring tool, and the agent CLI"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Content hashes and revisions: Rust only.
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4", features = ["derive"] }
# Item IDs and project IDs.
getrandom = "0.3"
# Mapping files' regex transforms: ryupdm's own regex crate.
regex-lite = "0.1"
# XLSX's XML (`import::xlsx`): pure Rust, as ryudfm reads ODB++'s. Its
# zip is read by ryupdm's bounded reader.
roxmltree = "0.21"
# Release history and tags, read through ryupdm's own gix.
gix = { version = "0.89", default-features = false, features = ["sha1", "revision"] }
ryu-doc = { path = "../ryu-doc" }
ryu-git = { path = "../ryu-git" }
# The hosted service's client (design 938): `ryuplm review` and
# `where-used --org`. HTTPS on rustls, as ryucad's and ryueda's.
ryu-review = { path = "../ryu-review" }
ryu-session = { path = "../ryu-session" }
# AML names and lifecycles, shared with ryueda's part data (no project).
ryueda-parts = { path = "../ryueda-parts" }
# Revisions, releases, states, the commit guard: ryupdm's core only. Its
# `cad` feature would pull ryucad-doc.
ryupdm = { path = "../ryupdm", default-features = false }
# ryucad's file format, for linked ryucad assemblies' lines through
# ryupdm's structure reader (`cad`). It depends on ryukei and ryusketch
# itself; `--no-default-features` builds without it.
ryucad-doc = { path = "../ryucad-doc", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
default = ["cad"]
# ryucad's half: linked ryucad assemblies' lines, read in process through
# ryupdm's structure (design 180). ryueda's are read through its
# executable, so there is no `eda` feature.
cad = ["ryupdm/cad", "dep:ryucad-doc"]
# Seeded catalogues for this crate's tests and the fuzz target.
testing = []

[dev-dependencies]
assert_cmd = "2"
ryu-review = { path = "../ryu-review", features = ["testing"] }
ryuplm = { path = ".", default-features = false, features = ["testing"] }
tempfile = "3"

# One `syncfs` after a large write (`write::write_all`); already in the
# build through ryu-session.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# musl's allocator is slow under multithreaded allocation, as for ryucad,
# ryueda and ryudfm.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"
