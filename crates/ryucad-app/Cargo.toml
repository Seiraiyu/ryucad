[package]
name = "ryucad-app"
description = "The ryucad desktop app: watch, point at and adjust what agents build"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# egui on winit and wgpu: all Rust, no C. Only what the app uses.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wayland", "wgpu", "x11"] }
png = "0.18"
pollster = "0.4"
# Native Open dialogs: the XDG portal on Linux (all Rust), AppKit, Win32.
rfd = "0.17"
ryucad = { path = "../ryucad" }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Only for a feature of eframe's winit: on Wayland compositors that leave
# decorations to the window (GNOME), a title bar that shows the title.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }
# The X11 work area (the screen less panels), which winit doesn't give: the
# all-Rust connection winit's X11 backend already builds.
x11rb = { version = "0.13", default-features = false }

# Whether a dialog can be seen (not in session 0's window station).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
divan = "0.1"
# The generated projects of `ryucad::bench`, for the window at scale.
ryucad = { path = "../ryucad", features = ["bench"] }
egui_kittest = { version = "0.37", features = ["eframe", "snapshot", "wgpu"] }
tempfile = "3"

[[bench]]
name = "view"
harness = false
