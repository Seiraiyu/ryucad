[package]
name = "ryu-session"
description = "What a ryu product's session daemon shares: endpoints, the daemon loop and its clients, notifications, participants, the activity log and undo, preferences and freshness"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Rust only: no C or assembly to build on any platform.
blake3 = { version = "1", features = ["pure"] }
interprocess = "2"
# File events (inotify, FSEvents, ReadDirectoryChangesW) for freshness.
# Rust, but for macOS's CoreServices framework, which it links and the
# system provides.
notify = "8"
rayon = "1"
ryu-doc = { path = "../ryu-doc" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux's file events without IN_OPEN, which notify's mask holds (#755):
# the version notify 8.2.1 already pulls in, so no new package.
[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11.5", default-features = false }

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
