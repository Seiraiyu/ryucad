[package]
name = "ryukei-testkit"
description = "Test-only helpers for ryukei: exact references, deterministic inputs, golden hashes"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Only for the Euler sequence interpreter; ryukei itself depends on this
# crate only as a dev-dependency, so there is no cycle at runtime.
ryukei = { path = "../ryukei" }
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
rayon = "1"
