[package]
name = "ryukei-bench"
description = "Benchmarks for ryukei, and (behind `occt` and `smlib`) comparisons against OCCT and SMLib"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[features]
# The OCCT comparison: a C++ shim linked against a system OCCT. Off by
# default, so the default build has no C++ on any platform.
occt = ["dep:cxx", "dep:cxx-build"]
# The SMLib comparison: a C++ shim linked against libsmlib, built from
# NVIDIA's USD BRep (the devcontainer builds it). Off by default too.
smlib = ["dep:cxx", "dep:cxx-build"]

[dependencies]
cxx = { version = "1", optional = true }
ryukei = { path = "../ryukei" }

[build-dependencies]
cxx-build = { version = "1", optional = true }

[dev-dependencies]
divan = "0.1"
rayon = "1"
ryukei-testkit = { path = "../ryukei-testkit" }

[[bench]]
name = "foundations"
harness = false

[[bench]]
name = "topology"
harness = false

[[bench]]
name = "geometry"
harness = false

[[bench]]
name = "mesh"
harness = false

[[bench]]
name = "occt"
harness = false
required-features = ["occt"]

[[bench]]
name = "smlib"
harness = false
required-features = ["smlib"]

# Three-way: SMLib's deviation and the exact values come from OCCT.
[[test]]
name = "kernels"
required-features = ["occt", "smlib"]
