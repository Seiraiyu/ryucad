[package]
name = "ryukei-bench"
description = "Benchmarks for ryukei, and (behind `occt` and `smlib`) comparisons against OCCT and SMLib"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[features]
# The OCCT comparison: a C++ shim linked against a system OCCT. Off by
# default, so the default build has no C++ on any platform.
occt = ["dep:cxx", "dep:cxx-build"]
# The SMLib comparison: a C++ shim linked against libsmlib, built from
# NVIDIA's USD BRep (the devcontainer builds it). Off by default too.
smlib = ["dep:cxx", "dep:cxx-build"]
# The mesh formats' references: a C++ shim linked against lib3mf, the 3MF
# Consortium's library (the devcontainer builds it); STL goes to OCCT.
formats = ["dep:cxx", "dep:cxx-build"]

[dependencies]
cxx = { version = "1", optional = true }
ryukei = { path = "../ryukei" }

[build-dependencies]
cxx-build = { version = "1", optional = true }

[dev-dependencies]
divan = "0.1"
rayon = "1"
# Projects exported by ryucad, for OCCT to read (the `step` test).
ryucad = { path = "../ryucad" }
ryukei-testkit = { path = "../ryukei-testkit" }
ryuformats = { path = "../ryuformats" }
ryustep = { path = "../ryustep" }
serde_json = "1"
tempfile = "3"

[[bench]]
name = "foundations"
harness = false

[[bench]]
name = "topology"
harness = false

[[bench]]
name = "geometry"
harness = false

[[bench]]
name = "mesh"
harness = false

[[bench]]
name = "sweep"
harness = false

[[bench]]
name = "boolean"
harness = false

[[bench]]
name = "occt"
harness = false
required-features = ["occt"]

[[bench]]
name = "smlib"
harness = false
required-features = ["smlib"]

[[bench]]
name = "boolean_kernels"
harness = false
required-features = ["occt", "smlib"]

# Three-way: SMLib's deviation and the exact values come from OCCT.
[[test]]
name = "kernels"
required-features = ["occt", "smlib"]

# The SMLib spike (design 27, stage 0): booleans, speed and repeatability.
[[test]]
name = "spike"
required-features = ["occt", "smlib"]

# Booleans head to head (design 32, phase 6), and the 1000-hole race.
[[test]]
name = "booleans"
required-features = ["occt", "smlib"]

# Blends head to head (design 43, phase 6), and the 1000-rim race.
[[test]]
name = "blends"
required-features = ["occt", "smlib"]

[[bench]]
name = "blend"
harness = false

[[bench]]
name = "blend_kernels"
harness = false
required-features = ["occt", "smlib"]

[[bench]]
name = "step"
harness = false

# STEP head to head (design 55, plan 7.D), and the large-assembly race.
[[test]]
name = "step"
required-features = ["occt"]

# STL and 3MF read by OCCT and lib3mf (design 193, plan 8.A).
[[test]]
name = "formats"
required-features = ["occt", "formats"]
