[package]
name = "ryukei-bench"
description = "Benchmarks for ryukei, and (behind `occt`) comparisons against OCCT"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[features]
# The OCCT comparison: a C++ shim linked against a system OCCT. Off by
# default, so the default build has no C++ on any platform.
occt = ["dep:cxx", "dep:cxx-build"]

[dependencies]
cxx = { version = "1", optional = true }
ryukei = { path = "../ryukei" }

[build-dependencies]
cxx-build = { version = "1", optional = true }

[dev-dependencies]
divan = "0.1"
rayon = "1"
ryukei-testkit = { path = "../ryukei-testkit" }

[[bench]]
name = "foundations"
harness = false

[[bench]]
name = "topology"
harness = false

[[bench]]
name = "geometry"
harness = false

[[bench]]
name = "mesh"
harness = false

[[bench]]
name = "occt"
harness = false
required-features = ["occt"]

[[test]]
name = "occt"
required-features = ["occt"]
