[package]
name = "ryucad"
description = "Agent-driven CAD built on the ryukei kernel"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
# Rust only: no C or assembly to build on any platform.
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4", features = ["derive"] }
# Reads history only: no network, no writes, no C.
gix = { version = "0.89", default-features = false, features = ["sha1", "revision"] }
interprocess = "2"
png = "0.18"
# An 8×8 bitmap font for labels in renders.
font8x8 = { version = "0.3", default-features = false }
rayon = "1"
ryu-session = { path = "../ryu-session" }
ryucad-doc = { path = "../ryucad-doc" }
ryuformats = { path = "../ryuformats" }
ryukei = { path = "../ryukei" }
ryumate = { path = "../ryumate" }
ryupdm = { path = "../ryupdm" }
ryustep = { path = "../ryustep" }
ryusketch = { path = "../ryusketch" }
serde = { version = "1", features = ["derive"] }
# Correctly rounded float parsing: without it, a number read back can be
# one ulp off what was written.
serde_json = { version = "1", features = ["float_roundtrip"] }
# HTTPS for `ryucad review`, the hosted review service's client. rustls with
# the ring provider and built-in web PKI roots: static musl binaries need no
# system OpenSSL. ring brings C and assembly into this binary, against the
# pure-Rust preference above, because review carries users' GitHub tokens
# and ring is the mature, audited provider (the pure-Rust one is young and
# unaudited). It builds on every release target (musl-gcc on Linux), and
# the kernel crates don't depend on it.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The race bodies the benchmark project imports (`bench` only: test-only
# helpers are never in a release build).
ryukei-testkit = { path = "../ryukei-testkit", optional = true }

[features]
# `ryucad::bench`: the generated projects benchmarks and bars measure.
bench = ["dep:ryukei-testkit"]

[dev-dependencies]
assert_cmd = "2"
divan = "0.1"
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
proptest = "1"
ryucad-doc = { path = "../ryucad-doc", features = ["test-support"] }
ryukei-testkit = { path = "../ryukei-testkit" }
tempfile = "3"
# 3MF exports read back in tests.
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bench]]
name = "session"
harness = false

[[bench]]
name = "assembly"
harness = false

[[bench]]
name = "step"
harness = false

[[test]]
name = "scale_bar"
required-features = ["bench"]

[[example]]
name = "ryucad-bench-gen"
required-features = ["bench"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

# musl's allocator is slow under multithreaded allocation, and rebuild runs
# features in parallel; glibc builds use it too, so they measure what ships.
# Kernel results don't depend on the allocator.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1"
