[package]
name = "ryucad"
description = "Agent-driven CAD built on the ryukei kernel"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ryukei = { path = "../ryukei" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
