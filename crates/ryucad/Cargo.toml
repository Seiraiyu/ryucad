[package]
name = "ryucad"
description = "Agent-driven CAD built on the ryukei kernel"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ryukei = { path = "../ryukei" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
proptest = "1"
ryukei-testkit = { path = "../ryukei-testkit" }

# musl's allocator is slow under multithreaded allocation, and rebuild runs
# features in parallel. Kernel results don't depend on the allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"
