[package]
name = "ryupdm"
description = "Product data management for ryu projects: part properties, revisions and releases"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# The content hash, as ryucad hashes its files.
blake3 = { version = "1", features = ["pure"] }
# Attestations on release tags (`attest`): Ed25519 signatures verified
# here, made only under `testing` and by the hosted service. Pure Rust;
# `std` only (no `rand_core`, no `serde`): keys and signatures are bytes.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "fast"] }
# Release history and tags, read as ryucad reads Git; and dependencies
# fetched (`deps`): Git's own transports for `file://`, local paths and
# SSH (the system `ssh`), with Git's credential helpers.
gix = { version = "0.89", default-features = false, features = ["sha1", "revision", "blocking-network-client"] }
# Git's smart HTTP for dependencies over `https://`, through ureq below
# (`deps::http`): gix's own backends are curl or reqwest.
gix-transport = { version = "0.61", default-features = false, features = ["http-client"] }
# Fresh project IDs.
getrandom = "0.3"
# Release packages' zips (`package::zip`), as PDF and 3MF deflate.
miniz_oxide = "0.8"
# Part number patterns: Rust's regex syntax, ASCII classes (`\d` is 0-9).
regex-lite = "0.1"
ryu-doc = { path = "../ryu-doc" }
# Layouts: a product's manifest, root files and folders (`product`).
ryu-git = { path = "../ryu-git" }
# ryucad's files, for ryucad's half (`cad`) only.
ryucad-doc = { path = "../ryucad-doc", optional = true }
serde = "1"
# HTTPS for fetching dependencies: rustls with ring and web PKI roots, as
# ryucad's review client (see its Cargo.toml for why ring).
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
# Seeded projects for the structure property tests.
ryucad-doc = { path = "../ryucad-doc", features = ["test-support"] }
tempfile = "3"
ryupdm = { path = ".", features = ["testing"] }

[features]
# ryucad's half: its product (`cad::Cad`), content hash, item numbers,
# structure, BOMs, where-used and locks. The service and ryucad build it;
# ryueda doesn't (design 629).
default = ["cad"]
cad = ["dep:ryucad-doc"]
# Signing attestations (`attest::sign`) and a test key, for this crate's
# tests, ryucad's scenarios and goldens, and the fuzz targets.
testing = []
