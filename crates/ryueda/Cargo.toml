[package]
name = "ryueda"
description = "Agent-driven electronics CAD: projects of canonical JSON in Git, a component library, connectivity and ERC"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
# Rust only but for HTTPS: ureq on rustls with ring (C and assembly), as
# ryucad's and ryupdm's binaries already build it, for part catalogues
# (design 347; plan 387's question 246). Nothing else brings C.
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
rayon = "1"
ryu-doc = { path = "../ryu-doc" }
# Part data: the vocabulary, records, searches and their cache (design 347).
ryueda-parts = { path = "../ryueda-parts" }
# The exchange structure alone, to check that 3D models parse: no kernel.
ryu-part21 = { path = "../ryu-part21" }
# Schematics: placement, routing, lint and SVG (design 236).
ryusch = { path = "../ryusch" }
# PNGs an agent looks at, rasterized from the SVG with the bundled font
# only (no system fonts): Rust, no C.
resvg = { version = "0.49", default-features = false, features = ["text"] }
# The output job's PDF: its objects, and the bundled font subset and
# embedded so text is real (Rust, no C; design 236).
pdf-writer = "0.15"
subsetter = { version = "0.2", default-features = false }
# The bundled font's glyphs and widths, for the PDF's text.
ttf-parser = "0.25"
# The embedded font deflated, the same bytes everywhere.
miniz_oxide = "0.8"
# The PDF's arcs: sines and tangents with the same bits everywhere.
ryu-math = { path = "../ryu-math" }
ryu-session = { path = "../ryu-session" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2"
# Catalogue fixtures in their sources' shapes, written by us.
ryueda-parts = { path = "../ryueda-parts", features = ["testing"] }
# The schematic corpus's references, checked by SHA-256.
sha2 = "0.11"
divan = "0.1"
tempfile = "3"

[[bench]]
name = "eda"
harness = false

# musl's allocator is slow under multithreaded allocation; ryucad's
# release binaries take mimalloc for the same reason.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"
