[package]
name = "ryu-copper"
description = "The copper engine every ryu product measures boards with: exact distances, booleans, an incremental index and connectivity"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
ryu-board = { path = "../ryu-board" }
ryu-math = { path = "../ryu-math" }
# Bodies are built and pairs judged per item in parallel.
rayon = "1"

[dev-dependencies]
divan = "0.1"
ryu-board = { path = "../ryu-board", features = ["testing"] }

[[bench]]
name = "copper"
harness = false
