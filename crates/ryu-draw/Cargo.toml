[package]
name = "ryu-draw"
description = "2D drawings every ryu product writes: exact curves, text in Inter, line styles, and PDF and SVG writers"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Arcs as Béziers: sines and tangents with the same bits everywhere.
ryu-math = { path = "../ryu-math" }
# PDF's objects, and the bundled font subset and embedded so text is real
# (Rust, no C).
pdf-writer = "0.15"
subsetter = { version = "0.2", default-features = false }
# The bundled font's glyphs, widths and metrics.
ttf-parser = "0.25"
# The embedded font deflated, the same bytes everywhere.
miniz_oxide = "0.8"
# A subset font's name, from the glyphs it holds (pure Rust).
blake3 = { version = "1", features = ["pure"] }
