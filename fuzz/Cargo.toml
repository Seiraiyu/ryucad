[package]
name = "ryukei-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ryucad = { path = "../crates/ryucad" }
ryukei = { path = "../crates/ryukei" }
ryukei-testkit = { path = "../crates/ryukei-testkit" }

[[bin]]
name = "predicates"
path = "fuzz_targets/predicates.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interval"
path = "fuzz_targets/interval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "euler"
path = "fuzz_targets/euler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nurbs"
path = "fuzz_targets/nurbs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mesh"
path = "fuzz_targets/mesh.rs"
test = false
doc = false
bench = false

[[bin]]
name = "feature"
path = "fuzz_targets/feature.rs"
test = false
doc = false
bench = false
