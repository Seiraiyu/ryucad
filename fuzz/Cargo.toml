[package]
name = "ryukei-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ryu-board = { path = "../crates/ryu-board", features = ["testing"] }
ryucad = { path = "../crates/ryucad" }
ryucad-doc = { path = "../crates/ryucad-doc", features = ["test-support"] }
ryudfm = { path = "../crates/ryudfm", features = ["testing"] }
ryueda = { path = "../crates/ryueda" }
ryukei = { path = "../crates/ryukei" }
ryukei-testkit = { path = "../crates/ryukei-testkit" }
ryumate = { path = "../crates/ryumate" }
ryupdm = { path = "../crates/ryupdm" }
ryusketch = { path = "../crates/ryusketch" }
ryustep = { path = "../crates/ryustep" }
rayon = "1"
serde = "1"
serde_json = "1"

[[bin]]
name = "predicates"
path = "fuzz_targets/predicates.rs"
test = false
doc = false
bench = false

